<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>No Internet Connection — HRMate</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0B132B;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #162032;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 36px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .icon-box {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: linear-gradient(135deg, #10B981, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
      font-weight: 900;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    p {
      font-size: 13.5px;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background: #10B981;
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      padding: 14px 28px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.85; transform: scale(0.98); }
    .footer-text {
      margin-top: 20px;
      font-size: 11.5px;
      color: #64748B;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">GD</div>
    <h1>No Internet Connection</h1>
    <p>Please check your Wi-Fi or mobile data connection to access HRMate portal.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
  <p class="footer-text">G.D. Foods Mfg. (I) Pvt. Ltd. · HRMate</p>
  <script>
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
