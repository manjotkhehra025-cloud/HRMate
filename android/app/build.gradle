plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gdfoods.hrmate'
    compileSdk 34

    defaultConfig {
        applicationId "com.gdfoods.hrmate"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    signingConfigs {
        release {
            def ksFile = file("hrmate-release.keystore")
            if (System.getenv("CM_KEYSTORE_PATH")) {
                ksFile = file(System.getenv("CM_KEYSTORE_PATH"))
            } else if (!ksFile.exists()) {
                ksFile = file("../hrmate-release.keystore")
            } else if (!ksFile.exists()) {
                ksFile = file("../../hrmate-release.keystore")
            }
            storeFile ksFile
            storePassword(System.getenv("CM_KEYSTORE_PASSWORD") ?: "hrmatepassword123")
            keyAlias(System.getenv("CM_KEY_ALIAS") ?: "hrmate")
            keyPassword(System.getenv("CM_KEY_PASSWORD") ?: "hrmatepassword123")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.biometric:biometric:1.1.0'
}
