name: hrmate
description: "HRMate — Smart HRMS WebView Shell for GD Foods Mfg. (I) Pvt. Ltd."
publish_to: 'none'
version: 1.0.5+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^3.16.9
  local_auth: ^2.2.0
  geolocator: ^11.0.0
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
