workflows:
  android-release:
    name: HRMate Native Android Release (APK & AAB)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      vars:
        PACKAGE_NAME: "com.gdfoods.hrmate"
      java: 17
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Check Java & Environment
        script: |
          java -version
          gradle -version || true
      - name: Build Android Release AAB & APK
        script: |
          cd android
          gradle assembleRelease bundleRelease -x lint -x test --no-daemon --stacktrace || (gradle wrapper --gradle-version 8.5 && chmod +x gradlew && ./gradlew assembleRelease bundleRelease -x lint -x test --no-daemon --stacktrace)
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - manjotkhehra025@gmail.com
        notify:
          failure: true
          success: true
