workflows:
  android-release:
    name: HRMate Native Android Release (APK & AAB)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      vars:
        PACKAGE_NAME: "com.gdfoods.hrmate"
      java: 17
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Check Java & Environment
        script: |
          java -version
          gradle -version || true
      - name: Decode Custom Keystore if provided
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "Decoding CM_KEYSTORE environment variable..."
            echo "$CM_KEYSTORE" | base64 --decode > android/app/hrmate-release.keystore
          else
            echo "Using repository release keystore (android/app/hrmate-release.keystore)"
          fi
      - name: Build Android Release AAB & APK
        script: |
          cd android
          gradle bundleRelease assembleRelease --no-daemon --stacktrace || (gradle wrapper --gradle-version 8.5 && chmod +x gradlew && ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace)
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - manjotkhehra025@gmail.com
        notify:
          failure: true
          success: true
