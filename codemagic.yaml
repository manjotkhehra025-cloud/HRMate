workflows:
  android-release:
    name: HRMate Android Release Build (APK & AAB)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      vars:
        PACKAGE_NAME: "org.duckdns.gdfoods.twa"
      java: 17
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Check Java & Environment
        script: |
          java -version
          if command -v gradle >/dev/null 2>&1; then gradle -version; fi
      - name: Decode Custom Keystore if provided
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "Decoding CM_KEYSTORE environment variable..."
            echo "$CM_KEYSTORE" | base64 --decode > android/app/hrmate-release.keystore
          else
            echo "Using repository release keystore (android/app/hrmate-release.keystore)"
          fi
      - name: Build Android Release AAB & APK
        script: |
          cd android
          # Ensure gradle wrapper jar exists
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar..."
            mkdir -p gradle/wrapper
            curl -sSL "https://repo.maven.apache.org/maven2/org/gradle/gradle-wrapper/8.5/gradle-wrapper-8.5.jar" -o gradle/wrapper/gradle-wrapper.jar || \
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar || true
          fi
          chmod +x gradlew || true
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Building with Gradle Wrapper (Gradle 8.5)..."
            ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
          else
            echo "Building with System Gradle..."
            gradle bundleRelease assembleRelease --no-daemon --stacktrace
          fi
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - manjotkhehra025@gmail.com
        notify:
          failure: true
          success: true
