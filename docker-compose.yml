services:
  hrmate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HRMATE_DOMAIN: gdfoods.duckdns.org
      HRMATE_RP_ID: gdfoods.duckdns.org
      HRMATE_ORIGIN: https://gdfoods.duckdns.org
      HRMATE_DB: /app/data/hrmate.db
      # Optional custom VAPID keys for Web Push. Leave empty to use demo keys.
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    volumes:
      - hrmate_data:/app/data
    networks:
      - hrmate_net

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./verify:/srv/verify:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - hrmate_net
    depends_on:
      - hrmate

volumes:
  hrmate_data:
  caddy_data:
  caddy_config:

networks:
  hrmate_net:
    driver: bridge
